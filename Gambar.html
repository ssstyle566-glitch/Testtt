<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>gambar</title>
  <style>
    
  /* NAVBAR */
    .navbar{
      position:sticky;
      top:0;
      z-index:1000;
      width:100%;
      height:70px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 25px;
      box-sizing:border-box;
      background:rgba(255,255,255,.88);
      backdrop-filter:blur(15px);
      -webkit-backdrop-filter:blur(15px);
      border-bottom:1px solid rgba(0,0,0,.08);
      transition:.3s ease
    }
    
    .nav-logo{
      display:flex;
      align-items:center;
      gap:10px;
      font-size:20px;
      font-weight:800;
      color:#172033
    }
    
    .logo-icon{
      width:42px;
      height:42px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:23px;
      border-radius:12px;
      background:linear-gradient(135deg,#4facfe,#00c6ff);
      box-shadow:0 5px 15px rgba(0,150,255,.25)
    }

    .nav-actions{
      position:relative;
      display:flex;
      align-items:center;
      gap:8px
    }
    
    .theme-btn,.menu-btn{
      width:42px;
      height:42px;
      border:none;
      border-radius:50%;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:19px;
      background:#f1f5f9;
      transition:.25s ease
    }
    
    .menu-btn{
      font-size:25px;
      line-height:1;
      color:#172033
    }
    
    .theme-btn:hover,.menu-btn:hover{
      transform:scale(1.08);
      background:#e5edf5
    }
    
    .hamburger-menu{
      display:none;
      position:absolute;
      top:52px;
      right:0;
      width:190px;
      padding:8px;
      background:rgba(255,255,255,.98);
      border:1px solid #e5eaf1;
      border-radius:16px;
      box-shadow:0 12px 30px rgba(20,35,60,.16);
      animation:menuSlide .18s ease
    }
    
    .hamburger-menu.show{
      display:block
    }
    
    .hamburger-menu a{
      display:block;
      padding:12px 14px;
      border-radius:11px;
      text-decoration:none;
      color:#172033;
      font-size:15px;
      font-weight:600;
      transition:.2s ease
    }
    
    .hamburger-menu a:hover{
      background:#eef8ff;
      color:#2196f3
    }
    
    @keyframes menuSlide{
      from{opacity:0;
           transform:translateY(-7px)
          }to{
        opacity:1;
        transform:translateY(0)
      }}

/* =========================
   DARK MODE
========================= */

body.dark-mode {
    background: #0f172a;
    color: #e5e7eb;
}

body.dark-mode .navbar {
    background: rgba(15, 23, 42, 0.88);
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
}

body.dark-mode .nav-logo {
    color: #f8fafc;
}

body.dark-mode .nav-menu a {
    color: #cbd5e1;
}

body.dark-mode .nav-menu a:hover {
    color: #60a5fa;
    background: rgba(96, 165, 250, 0.12);
}

body.dark-mode .theme-btn {
    background: #1e293b;
}

body.dark-mode .menu-btn{
  background:#1e293b;
  color:#f8fafc
}
    
body.dark-mode .hamburger-menu{
  background:rgba(15,23,42,.98);
  border-color:rgba(255,255,255,.08)
}
    
body.dark-mode .hamburger-menu a{
  color:#cbd5e1
}
    
body.dark-mode .hamburger-menu a:hover{
  color:#60a5fa;
  background:rgba(96,165,250,.12)
}


/* =========================
   HP / MOBILE
========================= */

@media (max-width: 600px) {

    .navbar {
        height: 62px;
        padding: 0 15px;
    }

    .nav-logo {
        font-size: 16px;
    }

    .logo-icon {
        width: 36px;
        height: 36px;
        font-size: 19px;
    }

    .hamburger-menu { display: none; }

    .theme-btn, .menu-btn { width: 38px; height: 38px; }
    .menu-btn { font-size: 23px; }
    .hamburger-menu { top: 48px; width: 180px; }
   }
    
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="nav-logo">
      <div class="logo-icon">
        📱
      </div>
      <span>
        Kumpulan Aplikasi
      </span>
    </div>
    <div class="nav-actions">
      <button id="themeToggle" class="theme-btn" aria-label="Ubah tema">
        🌙
      </button>
      <button id="menuToggle" class="menu-btn" aria-label="Buka menu" aria-expanded="false"> 
        ☰
      </button>
      <div id="hamburgerMenu" class="hamburger-menu">
        <a href="index.html">
          🏠 Home</a>
        <a href="Tentang.html">
          ℹ️ Tentang</a>
        <a href="Gambar.html">
          🖼️ Gambar</a>
      </div>
    </div>
  </nav>
  
<script>
  const themeToggle=document.getElementById("themeToggle"),
    menuToggle=document.getElementById("menuToggle"),
    hamburgerMenu=document.getElementById("hamburgerMenu");
  themeToggle.addEventListener("click",()=>{
    document.body.classList.toggle("dark-mode");
  const dark=document.body.classList.contains("dark-mode");
    themeToggle.textContent=dark?"☀️":"🌙";
    localStorage.setItem("theme",dark?"dark":"light")});
  if(localStorage.getItem("theme")==="dark"){
    document.body.classList.add("dark-mode");
    themeToggle.textContent="☀️"
  }
  menuToggle.addEventListener("click",e=>{
    e.stopPropagation();
    const open=hamburgerMenu.classList.toggle("show");
    menuToggle.setAttribute("aria-expanded",open);
    menuToggle.textContent=open?"✕":"☰"});
  hamburgerMenu.querySelectorAll("a").forEach(a=>a.addEventListener("click",()=>{
    hamburgerMenu.classList.remove("show");
    menuToggle.setAttribute("aria-expanded","false");
    menuToggle.textContent="☰"}));
  document.addEventListener("click",e=>{if(!hamburgerMenu.contains(e.target)&&!menuToggle.contains(e.target)){
    hamburgerMenu.classList.remove("show");
    menuToggle.setAttribute("aria-expanded","false");
    menuToggle.textContent="☰"}});
  const search=document.getElementById("search"),cards=document.querySelectorAll(".card"),empty=document.getElementById("empty");search.addEventListener("input",function(){const keyword=this.value.toLowerCase().trim();let visible=0;cards.forEach(card=>{const show=card.dataset.name.toLowerCase().includes(keyword);card.style.display=show?"":"none";if(show)visible++});empty.style.display=visible===0?"block":"none"});
</script>
  
</body>
</html>
